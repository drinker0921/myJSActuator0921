<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务代理前台</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    #app { min-height: 100vh; }
    .loading { text-align: center; padding: 50px; font-family: sans-serif; color: #666; }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载...</div>
  <div id="app"></div>

  <script>
    // ==========================================
    // ⚙️ 基础配置区（你的后端地址和仓库名）
    // ==========================================
    const TARGET = 'http://61.147.97.234:15868';
    const BASE_PATH = '/myJSActuator0921'; 

    // ==========================================
    // 🔥 核心补丁：劫持全局 Fetch，防止页面内 JS 跨域报错
    // ==========================================
    const originalFetch = window.fetch;
    window.fetch = function(input, init) {
      let url = typeof input === 'string' ? input : input.url;
      
      // 如果页面里的 JS 请求了 /api/xxx 这种相对路径，强行拼上 TARGET
      if (url.startsWith('/')) {
        url = TARGET + url;
        if (typeof input === 'string') {
          input = url;
        } else {
          input = new Request(url, input);
        }
      }
      
      // 强制允许携带跨域 Cookie
      if (init) {
        init.credentials = 'include';
      }
      
      return originalFetch(input, init);
    };

    // ==========================================
    // 🚀 核心渲染函数：拉取并注入 HTML
    // ==========================================
    async function loadPage() {
      let path = window.location.pathname;
      let realPath = path.replace(BASE_PATH, '') || '/';
      
      // 容错处理：防止 GitHub 的 404 机制或用户误操作导致死循环
      if (realPath.includes('index.html') || realPath.includes('404.html')) {
          realPath = '/';
      }

      const query = window.location.search; 
      const targetUrl = `${TARGET}${realPath}${query}`;
      
      document.getElementById('loading').style.display = 'block';
      console.log('正在请求页面:', targetUrl);

      try {
        const res = await fetch(targetUrl, {
          method: 'GET',
          credentials: 'include' 
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        let html = await res.text();

        // 1. 路径重写（防止 CSS/JS/图片丢失）
        html = html.replace(/href="\/(?!\/)/g, `href="${TARGET}/`);
        html = html.replace(/src="\/(?!\/)/g, `src="${TARGET}/`);
        html = html.replace(/url\(\/(?!\/)/g, `url(${TARGET}/`);

        // 2. 注入页面
        document.getElementById('loading').style.display = 'none';
        const app = document.getElementById('app');
        app.innerHTML = html;

        // 3. 执行注入的 <script> 标签
        const scripts = app.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        document.getElementById('loading').innerHTML = `❌ 加载失败: ${err.message}<br><br>请检查控制台。`;
      }
    }

    // ==========================================
    // 🔥 拦截器 1：接管所有 <a> 标签点击
    // ==========================================
    document.addEventListener('click', function(e) {
      const a = e.target.closest('a');
      if (a && a.href) {
        let targetHref = a.href;
        
        // 拦截跳转到真实后端的链接
        if (targetHref.includes('61.147.97.234:15868')) {
          e.preventDefault();
          const newPath = targetHref.replace(TARGET, BASE_PATH);
          history.pushState(null, '', newPath);
          loadPage(); 
        } 
        // 拦截本地的相对路径链接
        else if (targetHref.startsWith(window.location.origin) || targetHref.startsWith('/')) {
           e.preventDefault();
           let path = targetHref.replace(window.location.origin, '');
           if (!path.startsWith(BASE_PATH)) {
               path = BASE_PATH + (path.startsWith('/') ? path : '/' + path);
           }
           history.pushState(null, '', path);
           loadPage();
        }
      }
    });

    // ==========================================
    // 🔥 拦截器 2：接管表单提交（登录/注册等）
    // ==========================================
    document.addEventListener('submit', function(e) {
      const form = e.target;
      if (form.tagName === 'FORM') {
        e.preventDefault(); 
        
        const formData = new FormData(form);
        let action = form.getAttribute('action') || '';
        if (action.startsWith('/')) action = action.substring(1);
        
        const method = (form.getAttribute('method') || 'POST').toUpperCase();
        const postUrl = `${TARGET}/${action}`;

        console.log('表单提交拦截:', postUrl, '方法:', method);

        fetch(postUrl, {
          method: method,
          body: method === 'POST' ? formData : new URLSearchParams(formData),
          credentials: 'include'
        }).then(async res => {
          
          // 【核心修复】处理 PHP 的 302/301 重定向
          if (res.redirected) {
             console.log('后端发生重定向，正在跳转:', res.url);
             let newUrl = res.url.replace(TARGET, BASE_PATH);
             history.pushState(null, '', newUrl);
             loadPage(); // 重新拉取新页面
             return;
          }

          const contentType = res.headers.get("content-type") || "";
          
          if (contentType.includes("application/json")) {
             // 如果后端返回 JSON 格式
             const data = await res.json();
             if (data.code === 200 || data.status === 'success') {
                if (data.redirect || data.url) {
                   let redirectUrl = data.redirect || data.url;
                   // 转换成前端路径并跳转
                   let newUrl = BASE_PATH + (redirectUrl.startsWith('/') ? redirectUrl : '/' + redirectUrl);
                   history.pushState(null, '', newUrl);
                   loadPage();
                } else {
                   loadPage(); // 刷新当前页
                }
             } else {
                alert(data.msg || data.message || "操作失败");
             }
          } else {
             // 如果后端直接返回了一段 HTML（没有重定向）
             let html = await res.text();
             
             // 重新重写路径并渲染
             html = html.replace(/href="\/(?!\/)/g, `href="${TARGET}/`);
             html = html.replace(/src="\/(?!\/)/g, `src="${TARGET}/`);
             
             document.getElementById('app').innerHTML = html;
             history.pushState(null, '', BASE_PATH + '/' + action);
             
             // 重新执行注入的 JS
             const scripts = document.getElementById('app').querySelectorAll('script');
             scripts.forEach(oldScript => {
               const newScript = document.createElement('script');
               Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
               newScript.appendChild(document.createTextNode(oldScript.innerHTML));
               oldScript.parentNode.replaceChild(newScript, oldScript);
             });
          }
        }).catch(err => alert('提交请求失败: ' + err.message));
      }
    });

    // 监听浏览器的前进/后退
    window.addEventListener('popstate', loadPage);

    // 启动页面
    loadPage();
  </script>
</body>
</html>
