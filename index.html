<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务代理前台</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    #app { min-height: 100vh; }
    .loading { text-align: center; padding: 50px; font-family: sans-serif; color: #666; }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载数据...</div>
  <div id="app"></div>

  <script>
    // ==========================================
    // ⚙️ 配置区（请确保你的仓库名没写错）
    // ==========================================
    const TARGET = 'http://61.147.97.234:15868';
    const BASE_PATH = '/myJSActuator0921'; 

    // ==========================================
    // 🚀 核心渲染函数
    // ==========================================
    async function loadPage() {
      let path = window.location.pathname;
      
      // 1. 剥离掉 GitHub 的仓库前缀
      let realPath = path.replace(BASE_PATH, '') || '/';
      
      // 2. 修复路径：如果因为 GitHub 的 404 机制或者用户误操作，
      // 导致路径里包含了 index.html 或 404.html，直接替换为根目录 '/'
      if (realPath.includes('index.html') || realPath.includes('404.html')) {
          realPath = '/';
      }

      const query = window.location.search; 
      const targetUrl = `${TARGET}${realPath}${query}`;
      
      document.getElementById('loading').style.display = 'block';
      console.log('正在请求后端:', targetUrl);

      try {
        const res = await fetch(targetUrl, {
          method: 'GET',
          credentials: 'include', 
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        let html = await res.text();

        // 3. 路径重写：修复 CSS、JS、图片的绝对路径
        html = html.replace(/href="\/(?!\/)/g, `href="${TARGET}/`);
        html = html.replace(/src="\/(?!\/)/g, `src="${TARGET}/`);
        html = html.replace(/url\(\/(?!\/)/g, `url(${TARGET}/`);

        // 4. 注入 HTML
        document.getElementById('loading').style.display = 'none';
        const app = document.getElementById('app');
        app.innerHTML = html;

        // 5. 让注入的 <script> 标签重新执行（非常重要）
        const scripts = app.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        document.getElementById('loading').innerHTML = `❌ 加载失败: ${err.message}<br><br>请检查控制台 Network 面板。`;
      }
    }

    // ==========================================
    // 🔥 拦截器 1：接管所有 <a> 链接点击
    // ==========================================
    document.addEventListener('click', function(e) {
      const a = e.target.closest('a');
      if (a && a.href) {
        let targetHref = a.href;
        
        // 如果点击的链接是真实后端地址
        if (targetHref.includes('61.147.97.234:15868')) {
          e.preventDefault();
          const newPath = targetHref.replace(TARGET, BASE_PATH);
          history.pushState(null, '', newPath);
          loadPage(); 
        } 
        // 如果点击的是前端相对路径
        else if (targetHref.startsWith(window.location.origin) || targetHref.startsWith('/')) {
           e.preventDefault();
           let path = targetHref.replace(window.location.origin, '');
           if (!path.startsWith(BASE_PATH)) {
               path = BASE_PATH + (path.startsWith('/') ? path : '/' + path);
           }
           history.pushState(null, '', path);
           loadPage();
        }
      }
    });

    // ==========================================
    // 🔥 拦截器 2：接管表单提交（如登录、注册）
    // ==========================================
    document.addEventListener('submit', function(e) {
      const form = e.target;
      if (form.tagName === 'FORM') {
        e.preventDefault(); // 阻止原生跳转
        
        const formData = new FormData(form);
        let action = form.getAttribute('action') || '';
        
        // 拼接真实提交地址
        if (action.startsWith('/')) action = action.substring(1);
        const postUrl = `${TARGET}/${action}`;
        
        console.log('正在提交表单到:', postUrl);

        fetch(postUrl, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        }).then(res => {
          if (res.redirected) {
            // 如果后端要求重定向
            window.location.href = res.url.replace(TARGET, BASE_PATH);
          } else {
            // 提交成功，刷新当前页面数据
            loadPage();
          }
        }).catch(err => alert('提交失败: ' + err.message));
      }
    });

    // 监听浏览器的前进/后退按钮
    window.addEventListener('popstate', loadPage);

    // 首次打开执行
    loadPage();
  </script>
</body>
</html>
