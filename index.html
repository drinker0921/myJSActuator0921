<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小酒支付</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading { text-align: center; padding: 50px; font-family: sans-serif; color: #666; }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在连接服务器...</div>
  
  <!-- 🔥 核心：加入 credentialless 允许跨域 Cookie 传递 -->
  <iframe id="mainFrame" credentialless allow="cookies; storage-access" style="display:none;"></iframe>

  <script>
    // ==========================================
    // ⚙️ 配置区
    // ==========================================
    const TARGET = 'http://61.147.97.234:15868';
    const BASE_PATH = '/myJSActuator0921'; 
    const iframe = document.getElementById('mainFrame');

    // 1. 初始化 iframe：解析当前 GitHub 的路径并传给后端
    function initIframe() {
      let path = window.location.pathname;
      let realPath = path.replace(BASE_PATH, '') || '/';
      
      // 容错：处理 GitHub 404 兜底导致的路径污染
      if (realPath.includes('index.html') || realPath.includes('404.html')) {
          realPath = '/';
      }

      const query = window.location.search; 
      const targetUrl = `${TARGET}${realPath}${query}`;
      
      console.log('正在加载后端页面:', targetUrl);
      iframe.src = targetUrl;
    }

    // 2. 监听 iframe 加载完成，隐藏 Loading
    iframe.onload = function() {
        document.getElementById('loading').style.display = 'none';
        iframe.style.display = 'block';
    };

    // 3. 监听 iframe 内部传来的消息，同步浏览器地址栏路径
    window.addEventListener('message', function(e) {
      const data = e.data;
      if (data && data.type === 'IFRAME_PATH_CHANGE') {
        const innerPath = data.path; 
        // 把 iframe 里的真实路径无缝替换到浏览器的地址栏里
        const newUrl = BASE_PATH + innerPath;
        history.replaceState(null, '', newUrl);
      }
    });

    // 启动
    initIframe();
  </script>
</body>
</html>
