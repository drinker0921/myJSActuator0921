<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务代理前台</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    #app { padding: 20px; }
    .loading { text-align: center; padding: 50px; font-family: sans-serif; }
  </style>
</head>
<body>
  <div class="loading" id="loading">正在加载数据...</div>
  <div id="app"></div>

  <script>
    // 你的后端真实地址
    const TARGET = 'http://61.147.97.234:15868';
    
    // 当前 GitHub 的仓库路径（根据你实际情况修改）
    const BASE_PATH = '/myJSActuator0921'; 

    async function loadPage() {
      // 1. 解析用户在 GitHub 上访问的路径和参数
      // 比如：/myJSActuator0921/user/login?a=1
      let path = window.location.pathname;
      // 去掉 GitHub 的前缀，得到真实的请求路径（例如：/user/login）
      let realPath = path.replace(BASE_PATH, '') || '/';
      // 加上参数
      const query = window.location.search; 
      
      const targetUrl = `${TARGET}${realPath}${query}`;
      console.log('正在请求后端:', targetUrl);

      try {
        // 2. 发起请求（带上凭证，如果你的后端用到了 Session）
        const res = await fetch(targetUrl, {
          method: 'GET',
          credentials: 'include', // 允许跨域带上 Cookie
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);

        let html = await res.text();

        // 3. 修复相对路径（防止 GitHub 上去找 CSS）
        // 因为你的后端配置了 /public/ 直出，所以只要把根路径改成 TARGET 即可
        html = html.replace(/href="\/(?!\/)/g, `href="${TARGET}/`);
        html = html.replace(/src="\/(?!\/)/g, `src="${TARGET}/`);
        html = html.replace(/url\(\/(?!\/)/g, `url(${TARGET}/`);

        // 4. 注入 HTML
        document.getElementById('loading').style.display = 'none';
        const app = document.getElementById('app');
        app.innerHTML = html;

        // 5. 动态执行 HTML 里的 script 标签（因为 innerHTML 默认不执行 script）
        const scripts = app.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        document.getElementById('loading').innerHTML = `❌ 加载失败: ${err.message}<br>请检查浏览器控制台 Network 面板。`;
      }
    }

    // 6. 拦截页面内的超链接点击，防止跳转到 GitHub 导致 404
    document.addEventListener('click', function(e) {
      const a = e.target.closest('a');
      if (a && a.href && a.href.startsWith(TARGET)) {
        e.preventDefault();
        // 把 http://61.147.97.234:15868/user 替换为 /myJSActuator0921/user
        const newPath = a.href.replace(TARGET, BASE_PATH);
        history.pushState(null, '', newPath);
        loadPage(); // 重新加载
      }
    });

    // 监听浏览器的前进后退
    window.addEventListener('popstate', loadPage);

    // 启动
    loadPage();
  </script>
</body>
</html>
