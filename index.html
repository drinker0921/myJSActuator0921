<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>静态全站代理</title>
  <style>
    body { margin: 0; padding: 0; background: #f5f5f5; }
    iframe { width: 100%; height: 100vh; border: none; }
  </style>
</head>
<body>
  <!-- 用 iframe 来展示页面，但里面的请求会被 Service Worker 劫持 -->
  <iframe id="mainFrame"></iframe>

  <script>
    const BASE_PATH = '/myJSActuator0921';

    // 1. 注册 Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(BASE_PATH + '/sw.js', { scope: BASE_PATH + '/' })
        .then(reg => {
          console.log('Service Worker 代理已启动！', reg);
          // 等待 Service Worker 激活后，再加载 iframe
          if (navigator.serviceWorker.controller) {
            initIframe();
          } else {
            navigator.serviceWorker.ready.then(() => initIframe());
          }
        })
        .catch(err => {
          alert('Service Worker 注册失败，请确保你的 GitHub 是 HTTPS: ' + err);
        });
    } else {
      alert('你的浏览器不支持 Service Worker');
    }

    // 2. 加载 iframe
    function initIframe() {
      let path = window.location.pathname;
      let realPath = path.replace(BASE_PATH, '') || '/';
      if (realPath.includes('index.html') || realPath.includes('404.html')) realPath = '/';

      const query = window.location.search; 
      
      // 关键：请求的是本地的 /proxy/ 路径，让 Service Worker 去拦截
      const proxyUrl = `${BASE_PATH}/proxy${realPath}${query}`;
      
      console.log('iframe 加载本地代理路径:', proxyUrl);
      document.getElementById('mainFrame').src = proxyUrl;
    }
  </script>
</body>
</html>
