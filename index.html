<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务代理前台</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- iframe 占满全屏，所有的后端逻辑、样式全由它自己渲染 -->
  <iframe id="mainFrame"></iframe>

  <script>
    // ==========================================
    // ⚙️ 配置区
    // ==========================================
    const TARGET = 'http://61.147.97.234:15868';
    const BASE_PATH = '/myJSActuator0921'; 
    const iframe = document.getElementById('mainFrame');

    // ==========================================
    // 1. 初始化 iframe：解析当前 GitHub 的路径并传给后端
    // ==========================================
    function initIframe() {
      let path = window.location.pathname;
      let realPath = path.replace(BASE_PATH, '') || '/';
      
      // 容错：处理 GitHub 404 兜底导致的路径污染
      if (realPath.includes('index.html') || realPath.includes('404.html')) {
          realPath = '/';
      }

      const query = window.location.search; 
      // 拼接目标地址：http://61.147.97.234:15868/login.php?xxx=1
      const targetUrl = `${TARGET}${realPath}${query}`;
      
      console.log('iframe 正在加载:', targetUrl);
      iframe.src = targetUrl;
    }

    // ==========================================
    // 2. 监听 iframe 内部传来的消息（同步路径）
    // ==========================================
    window.addEventListener('message', function(e) {
      const data = e.data;
      
      // 只要 iframe 内部页面发生了跳转，就会发来消息
      if (data && data.type === 'IFRAME_PATH_CHANGE') {
        // 拿到 iframe 里的真实路径（比如 /user/index.php）
        const innerPath = data.path; 
        
        // 把这个路径无缝替换到浏览器的地址栏里
        const newUrl = BASE_PATH + innerPath;
        history.replaceState(null, '', newUrl);
      }
    });

    // 启动
    initIframe();
  </script>
</body>
</html>
